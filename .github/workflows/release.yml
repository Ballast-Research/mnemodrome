name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # all history and tags, so the release check sees the existing v* tags

      - name: Release check
        run: python3 scripts/release_check.py "$GITHUB_REF_NAME"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
          MNEMODROME_FACTS_PATH: /tmp/mnemodrome/facts
          MNEMODROME_LEARNINGS_PATH: /tmp/mnemodrome/learnings
          MNEMODROME_SESSIONS_PATH: /tmp/mnemodrome/sessions
          MNEMODROME_GRAPHS_PATH: /tmp/mnemodrome/graphs
          MNEMODROME_UPDATES_PATH: /tmp/mnemodrome/updates
          MNEMODROME_PROCEDURES_PATH: /tmp/mnemodrome/procedures
          EVENT_LOG_DB_PATH: /tmp/mnemodrome/events/events.db
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase repository path (github.repository is Ballast-Research/...)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          prerelease="$(python3 scripts/release_check.py "$GITHUB_REF_NAME" --is-prerelease)"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          # An rc never moves :latest; only a final tag does.
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_REF_NAME#v}"
            if [ "${prerelease}" = "false" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
